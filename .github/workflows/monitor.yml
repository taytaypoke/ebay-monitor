name: eBay Listing Monitor

on:
  schedule:
    # Runs every 5 minutes - testing scheduled trigger. GitHub may delay this slightly during
    # high-load periods, but it's typically close to on-time.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # lets you manually trigger a run from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit updated seen_items.json

jobs:
  check-ebay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python ebay_monitor.py

      - name: Commit updated seen_items.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_items.json
          git diff --staged --quiet || git commit -m "Update seen items"
          git push
